<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Uyarısı!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .box {
            border: 2px solid red;
            padding: 30px;
            border-radius: 10px;
            background: #222;
            box-shadow: 0 0 20px red;
            position: relative;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: absolute;
            transition: 0.1s;
        }
    </style>
</head>
<body>

    <div class="box" id="mainBox">
        <h1 id="text">⚠️ SİSTEMİNİZDE TEHLİKE TESPİT EDİLDİ! ⚠️</h1>
        <p>Devam etmek için aşağıdaki butona tıklayın.</p>
        <div style="height: 60px; position: relative;">
            <button id="runBtn" style="left: 40%; top: 10px;">Düzelt</button>
        </div>
    </div>

    <script>
        const btn = document.getElementById('runBtn');
        const text = document.getElementById('text');

        // Butondan kaçma fonksiyonu
        btn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        });

        // Ekran rengini değiştirme şakası
        setInterval(() => {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = randomColor;
        }, 500);
    </script>

</body>
</html>
